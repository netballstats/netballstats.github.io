<title>Opens Championship — Cross Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:      #15223b;
    --ink-2:    #51607a;
    --muted:    #9aa4b6;
    --line:     #dfe3ea;
    --line-2:   #eef0f4;
    --bg:       #f3f5f8;
    --card:     #ffffff;
    --accent:   #e8542f;
    --accent-bg:#fdece5;
    --win:      #157a47;
    --win-bg:   #e7f3ea;
    --loss:     #b23b2c;
    --loss-bg:  #fbe9e6;
    --draw-bg:  #fff3e0;
    --col-w:    52px;
    --name-w:   66px;
    --row-h:    33px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Barlow', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .scroll {
    flex: 1 1 auto;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 24px;
  }
  table.x { border-collapse: separate; border-spacing: 0; margin: 0; }
  table.x th, table.x td { padding: 0; margin: 0; }
  th.corner {
    position: sticky; left: 0; top: 0; z-index: 6;
    width: var(--name-w); min-width: var(--name-w);
    background: var(--card);
    border-right: 2px solid var(--line);
    border-bottom: 2px solid var(--line);
  }
  th.corner .lbl {
    font-family: 'Barlow Semi Condensed', sans-serif;
    font-size: 11px; font-weight: 700;
    color: var(--accent);
    padding: 5px 6px; text-align: left; line-height: 1.3;
  }
  th.corner .lbl a { color: inherit; text-decoration: none; }
  th.corner .lbl a:hover { text-decoration: underline; }
  th.colhead {
    position: sticky; top: 0; z-index: 4;
    width: var(--col-w); min-width: var(--col-w);
    background: var(--card);
    border-bottom: 2px solid var(--line);
    border-left: 1px solid var(--line-2);
    vertical-align: bottom;
    padding: 4px 3px;
    font-family: 'Barlow Semi Condensed', sans-serif;
    font-weight: 700; font-size: 10px;
    color: var(--ink); text-align: center;
    overflow-wrap: break-word; word-break: break-word;
    line-height: 1.15; vertical-align: top;
  }
  th.colhead .ckn {
    display: block;
    font-size: 8px; font-weight: 700;
    color: var(--muted); letter-spacing: .3px;
    line-height: 1.4;
  }
  th.rowhead {
    position: sticky; left: 0; z-index: 3;
    width: var(--name-w); min-width: var(--name-w);
    height: var(--row-h);
    background: var(--card);
    border-right: 2px solid var(--line);
    border-bottom: 1px solid var(--line-2);
    text-align: left; vertical-align: top;
  }
  th.rowhead .rn {
    display: flex; align-items: center; gap: 4px;
    padding: 3px 5px 3px 5px;
  }
  th.rowhead .rkn {
    flex: 0 0 auto; width: 13px;
    font-family: 'Barlow Semi Condensed', sans-serif;
    font-size: 11px; font-weight: 700;
    color: var(--muted); text-align: center;
  }
  th.rowhead .nm {
    font-size: 10px; font-weight: 600;
    line-height: 1.1; color: var(--ink);
  }
  td.cell {
    width: var(--col-w); min-width: var(--col-w);
    border-left: 1px solid var(--line-2);
    border-bottom: 1px solid var(--line-2);
    background: var(--card);
    vertical-align: top;
  }
  /* Per-game strip inside a cell */
  .mg {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: var(--row-h);
    gap: 1px; padding: 2px; width: 100%;
  }
  .mg + .mg { border-top: 1px solid var(--line-2); }
  .mg .rd {
    font-size: 8px; font-weight: 700;
    letter-spacing: .3px; color: var(--muted); line-height: 1;
  }
  .mg .score {
    font-family: 'Barlow Semi Condensed', sans-serif;
    font-weight: 700; font-size: 13px;
    line-height: 1; letter-spacing: -.1px;
  }
  .mg.win  { background: var(--win-bg); }
  .mg.win  .score { color: var(--win); }
  .mg.loss { background: var(--loss-bg); }
  .mg.loss .score { color: var(--loss); }
  .mg.draw { background: var(--draw-bg); }
  .mg.draw .score { color: #e65100; }
  .mg.live { background: var(--accent-bg); box-shadow: inset 0 0 0 2px var(--accent); }
  .mg.live .score {
    color: var(--accent);
    display: flex; align-items: center; justify-content: center; gap: 3px;
  }
  .mg.live .dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent); display: inline-block;
    animation: pulse 1.3s infinite;
  }
  .mg.fix { background: #f9fafb; text-align: center; line-height: 1.1; }
  .mg.fix .fl1 {
    font-size: 9.5px; font-weight: 600;
    color: var(--ink-2); white-space: nowrap;
  }
  .mg.fix .fl1 b { color: var(--ink); font-weight: 700; }
  .mg.fix .fl2 {
    font-size: 8.5px; font-weight: 500;
    color: var(--muted); white-space: nowrap;
  }
  .mg.fix.live { background: var(--accent-bg); box-shadow: inset 0 0 0 2px var(--accent); }
  .mg.fix.live .fl1, .mg.fix.live .fl1 b { color: var(--accent); }
  .mg.fix.live .fl2 { color: var(--accent); }
  .mg.next:not(.live) { box-shadow: inset 0 0 0 2px #5c6bc0; }
  .mg.next.fix:not(.live) { background: #eef0fb; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:.3;transform:scale(.6);} }
  td.cell.self {
    background:
      repeating-linear-gradient(-45deg, transparent 0 5px, rgba(255,255,255,.04) 5px 6px),
      var(--ink);
    overflow: hidden;
    text-align: center; vertical-align: middle;
    height: var(--row-h);
  }
  td.cell.self .sl1 { display: block; font-family: 'Barlow Semi Condensed', sans-serif; font-size: 13px; font-weight: 700; white-space: nowrap; line-height: 1; color: #fff; }
  td.cell.self .sl2 { display: block; font-size: 8px; font-weight: 700; letter-spacing: .3px; color: #aeb9cc; white-space: nowrap; line-height: 1; margin-top: 2px; }
  tr.pinned th.rowhead { background: #fff7ec; }
  tr.pinned td.cell:not(.self) .mg:not(.win):not(.loss):not(.live):not(.draw) { background-color: #fffaf2; }
  td.cell.pincol:not(.self) .mg:not(.win):not(.loss):not(.live):not(.draw) { background-color: #fffaf2; }
  tr.rg th.rowhead .nm { color: var(--muted); }
  tr.rg th.rowhead .rkn { color: var(--line); }
  th.colhead.rg { color: var(--muted); }
  tr.rg td.cell, td.cell.rgcol { opacity: 0.35; }
  @media (max-width: 400px) {
    :root { --col-w: 42px; --name-w: 54px; }
  }

</style>
<style>html { zoom: 1.5; }</style>

function render(d) {
  const key = (a, b) => [a, b].sort().join("|");

  // Build M as arrays — all games per pair, sorted by round.
  const M = {};
  d.games.forEach(([rd, h, hs, a, as_, court, st, fw, ds]) => {
    const k = key(h, a);
    if (!M[k]) M[k] = [];
    M[k].push({ rd, h, hs, a, as: as_, court, st, fw: fw || null, ds: ds || "" });
  });
  Object.values(M).forEach(arr => arr.sort((x, y) => x.rd - y.rd));

  const roundByN = Object.fromEntries(d.rounds.map(r => [r.n, r]));

  // Per-team next round: min round where their game isn't done
  const nextRound = {};
  d.teams.forEach(t => {
    let min = Infinity;
    d.games.forEach(([rd, h, , a, , , st]) => {
      if ((h === t.code || a === t.code) && st !== "done" && rd < min) min = rd;
    });
    nextRound[t.code] = min === Infinity ? null : min;
  });

  const grid = document.getElementById("grid");
  let html = "<thead><tr>";
  const titleEl = d.menu_url
    ? `<a href="${d.menu_url}">${d.title}</a>`
    : d.title;
  html += `<th class="corner"><div class="lbl">${titleEl}</div></th>`;
  d.teams.forEach(t => {
    html += `<th class="colhead${t.code === d.pin ? " pinhead" : ""}${t.regraded ? " rg" : ""}"><span class="ckn">${t.rank}</span>${t.name}</th>`;
  });
  html += "</tr></thead><tbody>";

  d.teams.forEach((rowT) => {
    const pinnedRow = rowT.code === d.pin;
    html += `<tr class="${pinnedRow ? "pinned" : ""}${rowT.regraded ? " rg" : ""}">`;
    html += `<th class="rowhead">
               <div class="rn">
                 <span class="rkn">${rowT.rank}</span>
                 <span class="nm">${rowT.name}</span>
               </div>
             </th>`;

    d.teams.forEach((colT) => {
      const pinCol = colT.code === d.pin && !pinnedRow;
      const pcls = (pinCol ? " pincol" : "") + (colT.regraded ? " rgcol" : "");

      if (rowT.code === colT.code) {
        html += `<td class="cell self">
                   <span class="sl1">${rowT.pts} pts</span>
                   <span class="sl2">${rowT.pct}%</span>
                 </td>`;
        return;
      }

      const games = M[key(rowT.code, colT.code)];
      if (!games) { html += `<td class="cell${pcls}"></td>`; return; }

      html += `<td class="cell${pcls}">`;
      games.forEach(m => {
        const rowScore = m.h === rowT.code ? m.hs : m.as;
        const colScore = m.h === rowT.code ? m.as : m.hs;
        const rmeta = roundByN[m.rd] || {};
        const ncls = m.rd === nextRound[rowT.code] ? " next" : "";

        if (m.fw) {
          const rowWon = m.h === rowT.code ? m.fw === "home" : m.fw === "away";
          const cls = rowWon ? "win" : "loss";
          html += `<div class="mg ${cls}${ncls}">
                     <span class="rd">R${m.rd}</span>
                     <span class="score">FORF</span>
                   </div>`;
        } else if (m.st === "live" && rowScore != null) {
          html += `<div class="mg live${ncls}">
                     <span class="rd">R${m.rd}</span>
                     <span class="score"><span class="dot"></span>${rowScore}–${colScore}</span>
                   </div>`;
        } else if (m.st === "done" && rowScore != null) {
          const cls = rowScore > colScore ? "win" : rowScore < colScore ? "loss" : "draw";
          html += `<div class="mg ${cls}${ncls}">
                     <span class="rd">R${m.rd}</span>
                     <span class="score">${rowScore}–${colScore}</span>
                   </div>`;
        } else {
          const liveCls = m.st === "live" ? " live" : "";
          html += `<div class="mg fix${liveCls}${ncls}">
                     <span class="fl1"><b>R${m.rd}</b> C${m.court}</span>
                     <span class="fl2">${m.ds}</span>
                   </div>`;
        }
      });
      html += `</td>`;
    });
    html += "</tr>";
  });

  html += "</tbody>";
  grid.innerHTML = html;
}
render(DATA);
